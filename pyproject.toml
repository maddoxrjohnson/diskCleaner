[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diskcleaner"
version = "0.1.0"
description = "Finds big files you probably don't need, and learns what you like to keep."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maddox Johnson" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "joblib>=1.3",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
diskcleaner = "diskcleaner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
